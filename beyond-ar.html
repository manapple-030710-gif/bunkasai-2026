<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BEYOND | AR Exhibition</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, sans-serif; }
    .controls { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.82) 25%); color: #fff; text-align: center; }
    .hint { font-size: 12px; letter-spacing: .06em; margin: 0 0 12px; color: #eee; text-shadow: 0 1px 4px #000; }
    .buttons { display: flex; justify-content: center; gap: 10px; max-width: 420px; margin: auto; }
    .buttons button { flex: 1; min-height: 48px; border: 1px solid rgba(255,255,255,.65); border-radius: 8px; background: rgba(20,20,20,.8); color: white; font-size: 15px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .buttons button.active { background: white; color: #111; border-color: white; }
    .buttons button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #status { margin: 8px 0 0; min-height: 14px; font-size: 11px; color: #ddd; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="movie" src="./colossus-alpha.webm" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="poster-target" mindar-image-target="targetIndex: 0">
      <a-plane position="0 0 0.01" width="1" height="1.414" material="shader: flat; src: #movie; transparent: true; alphaTest: 0.01;"></a-plane>
    </a-entity>
  </a-scene>

  <div class="controls">
    <p class="hint">ポスターにカメラを向けてください</p>
    <div class="buttons" role="group" aria-label="AR作品の切り替え">
      <button type="button" data-source="./colossus-alpha.webm" class="active" aria-pressed="true">巨人</button>
      <button type="button" data-source="./traveler-alpha.webm" aria-pressed="false">旅人</button>
      <button type="button" data-source="./bird-alpha.webm" aria-pressed="false">鳥</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <script>
    const movie = document.getElementById('movie');
    const buttons = [...document.querySelectorAll('[data-source]')];
    const status = document.getElementById('status');
    const target = document.getElementById('poster-target');
    let chosenSource = './colossus-alpha.webm';
    let inView = false;
    let switchCounter = 0;

    async function startVideo() {
      if (!inView || movie.readyState < 2) return;
      try {
        await movie.play();
        status.textContent = '';
      } catch (error) {
        status.textContent = '映像が始まらない場合は、作品ボタンをもう一度押してください';
      }
    }

    function switchVideo(source) {
      if (source === chosenSource) {
        startVideo();
        return;
      }
      chosenSource = source;
      const thisSwitch = ++switchCounter;
      buttons.forEach((button) => {
        const active = button.dataset.source === source;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      status.textContent = '作品を切り替えています…';
      movie.pause();
      movie.src = source;
      movie.load();
      movie.addEventListener('loadeddata', () => {
        if (thisSwitch !== switchCounter) return;
        status.textContent = '';
        startVideo();
      }, { once: true });
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => switchVideo(button.dataset.source));
    });
    target.addEventListener('targetFound', () => {
      inView = true;
      startVideo();
    });
    target.addEventListener('targetLost', () => {
      inView = false;
      movie.pause();
    });
    // iOSなどで再生開始に操作が必要な場合に備える。
    document.addEventListener('touchstart', () => { startVideo(); }, { passive: true });
  </script>
</body>
</html>
